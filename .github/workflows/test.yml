name: Rules and strategy tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rules, HTTP, privacy and tactical regressions
        run: python -B -m unittest discover -s tests -v
      - name: JavaScript and launcher syntax
        run: |
          node --check web/app.js
          sh -n run.sh
